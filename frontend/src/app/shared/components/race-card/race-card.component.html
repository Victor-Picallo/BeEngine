<div
  [ngStyle]="{'border': '1px solid ' + accent() + '55'}"
  style="background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%); border-radius: 8px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05);">

  <!-- Header: race info + countdown -->
  <div
    [ngStyle]="{'background': 'linear-gradient(90deg, ' + accent() + '22, transparent)', 'border-bottom': '1px solid ' + accent() + '44'}"
    style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div [style.color]="accent()" style="font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px;">
        Próxima carrera · Ronda {{ nextRace().round }}/{{ nextRace().totalRounds }}
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: #1a1a1a; line-height: 1.1;">{{ nextRace().name }}</div>
      <div style="font-size: 11px; color: #888; margin-top: 3px; display: flex; align-items: center; gap: 4px;">
        <svg width="11" height="14" viewBox="0 0 11 14" fill="none">
          <path d="M5.5 1 C3 1 1 3 1 5.5 C1 8.5 5.5 13 5.5 13 C5.5 13 10 8.5 10 5.5 C10 3 8 1 5.5 1Z" stroke="#888" stroke-width="1.2" fill="none"/>
          <circle cx="5.5" cy="5.5" r="1.5" fill="#888"/>
        </svg>
        {{ nextRace().location }}
      </div>
    </div>

    <!-- Countdown -->
    <div style="display: flex; gap: 6px; align-items: center;">
      @for (unit of countdownUnits(); track unit.label; let i = $index) {
        @if (i > 0) {
          <span style="color: #aaa; font-size: 16px; font-weight: 300;">:</span>
        }
        <div style="text-align: center;">
          <div
            [ngStyle]="{'border': '1px solid ' + accent() + '88'}"
            style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; line-height: 1; color: #1a1a1a; min-width: 36px; background: #f7f7f9; border-radius: 4px; padding: 3px 6px; letter-spacing: 2px;">{{ pad(unit.val) }}</div>
          <div style="font-size: 9px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;">{{ unit.label }}</div>
        </div>
      }
    </div>
  </div>

</div>
