<div class="hm-card">
  <div class="hm-card-head">
    <div class="hm-card-head-left">
      <div class="hm-card-accent-bar" [style.background]="accent()"></div>
      <span class="hm-card-title">{{ title() }}</span>
    </div>
  </div>
  <table class="hm-standings-table">
    <tbody>
      @for (d of standings(); track d.driverId ?? d.driver; let i = $index) {
        <tr
          class="driver-row"
          [class.driver-row--link]="!!d.driverId"
          [routerLink]="d.driverId ? ['/f1/pilotos', d.driverId] : null"
          appReturnNav
          [ngStyle]="{'border-bottom': i < standings().length - 1 ? '1px solid #f5f5f2' : 'none', 'background': i % 2 === 0 ? 'transparent' : '#fafaf8'}">
          <td style="padding: 7px 12px; width: 28px;">
            <span [ngStyle]="{'color': d.pos <= 3 ? (accent() === '#FFD100' ? '#C8963E' : accent()) : '#ccc'}" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px;">{{ d.pos }}</span>
          </td>
          <td style="padding: 7px 4px; width: 16px;">
            <div [style.background]="d.teamColor" style="width: 3px; height: 18px; border-radius: 2px;"></div>
          </td>
          <td style="padding: 7px 8px;">
            <div class="driver-name" style="font-weight: 600; font-size: 13px; color: #111; line-height: 1.2;">{{ d.driver }}</div>
            <div style="font-size: 10px; color: #bbb;">{{ flagMap[d.nationality] }} {{ d.team }}</div>
          </td>
          <td style="padding: 7px 14px; text-align: right;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: #111;">{{ d.points }}</span>
            <span style="font-size: 9px; color: #ccc; margin-left: 2px;">pts</span>
          </td>
        </tr>
      }
    </tbody>
  </table>
  @if (showFooter()) {
    <div class="hm-card-foot">
      <a routerLink="/f1/pilotos">Ver todos los pilotos →</a>
    </div>
  }
</div>
