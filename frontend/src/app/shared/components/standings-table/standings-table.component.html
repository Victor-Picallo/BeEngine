<div style="background: #141414; border: 1px solid #1e1e1e; border-radius: 8px; overflow: hidden; margin-bottom: 12px;">
  <div style="padding: 10px 14px; border-bottom: 1px solid #1e1e1e; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: #fff; text-transform: uppercase; letter-spacing: 1px;">Clasificación Pilotos</span>
    <button [style.color]="accent()" style="font-size: 11px; font-weight: 600;" (click)="toggleShowAll()">
      {{ showAll() ? 'Ver menos' : 'Ver todo' }}
    </button>
  </div>

  <table style="width: 100%; border-collapse: collapse;">
    <tbody>
      @for (d of visibleDrivers(); track d.driver; let i = $index) {
        <tr
          class="driver-row"
          [ngStyle]="{'border-bottom': i < visibleDrivers().length - 1 ? '1px solid #191919' : 'none', 'background': i % 2 === 0 ? 'transparent' : '#111'}">
          <td style="padding: 7px 12px; width: 28px;">
            <span [ngStyle]="{'color': d.pos <= 3 ? accent() : '#444'}" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px;">{{ d.pos }}</span>
          </td>
          <td style="padding: 7px 4px; width: 16px;">
            <div [style.background]="d.teamColor" style="width: 3px; height: 18px; border-radius: 2px;"></div>
          </td>
          <td style="padding: 7px 8px;">
            <div style="font-weight: 600; font-size: 13px; color: #ddd; line-height: 1.2;">{{ d.driver }}</div>
            <div style="font-size: 10px; color: #444;">{{ flagMap[d.nationality] }} {{ d.team }}</div>
          </td>
          <td style="padding: 7px 14px; text-align: right;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: #fff;">{{ d.points }}</span>
            <span style="font-size: 9px; color: #333; margin-left: 2px;">pts</span>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
