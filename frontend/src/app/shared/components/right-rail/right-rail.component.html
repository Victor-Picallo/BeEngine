<aside style="width: 220px; flex-shrink: 0; padding: 14px 12px; border-left: 1px solid #e5e5e7; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 50px; height: calc(100vh - 50px); overflow-y: auto; background: #fafafa;">

  <!-- Quick Stats -->
  <div style="background: #ffffff; border: 1px solid #e5e5e7; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.03);">
    <div style="padding: 10px 12px; border-bottom: 1px solid #e5e5e7;">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; color: #1a1a1a; text-transform: uppercase; letter-spacing: 1px;">Stats rápidas</span>
    </div>
    <div style="padding: 8px 12px; display: flex; flex-direction: column; gap: 8px;">
      @for (s of quickStats(); track s.label) {
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
          <span style="font-size: 11px; color: #888; line-height: 1.3;">{{ s.label }}</span>
          <span style="font-size: 12px; font-weight: 700; color: #1a1a1a; text-align: right; white-space: nowrap;">{{ s.val }}</span>
        </div>
      }
    </div>
  </div>

  <!-- Trending -->
  <div style="background: #ffffff; border: 1px solid #e5e5e7; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.03);">
    <div style="padding: 10px 12px; border-bottom: 1px solid #e5e5e7;">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; color: #1a1a1a; text-transform: uppercase; letter-spacing: 1px;">Trending</span>
    </div>
    <div style="padding: 4px 0;">
      @if (!trendingNews().length) {
        <div style="padding: 18px 12px; text-align: center;">
          <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase;">Próximamente</div>
        </div>
      }
      @for (n of trendingNews(); track n.title; let i = $index) {
        <div
          class="trending-item"
          [ngStyle]="{'border-bottom': i < 2 ? '1px solid #f0f0f2' : 'none'}"
          style="padding: 7px 12px; display: flex; gap: 8px; cursor: pointer;">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: #d5d5d8; min-width: 20px;">{{ i + 1 }}</span>
          <div>
            <div style="font-size: 11px; color: #444; line-height: 1.3;">{{ n.title }}</div>
            <div style="font-size: 10px; color: #aaa; margin-top: 2px;">{{ n.time }}</div>
          </div>
        </div>
      }
    </div>
  </div>

</aside>
