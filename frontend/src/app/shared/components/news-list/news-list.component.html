<div class="hm-card" [class.hm-card--news-compact]="compact()">
  <div class="hm-card-head">
    <div class="hm-card-head-left">
      <div class="hm-card-accent-bar" [style.background]="accent()"></div>
      <span class="hm-card-title">Últimas noticias</span>
    </div>
    <a routerLink="/noticias" class="hm-card-link" [style.color]="accent() === '#FFD100' ? '#888' : accent()">Ver todas →</a>
  </div>

  @if (!listItems().length) {
    <p class="hm-news-empty">No hay noticias disponibles en este momento.</p>
  }

  @for (n of listItems(); track n.id ?? n.title; let i = $index) {
    <a
      class="hm-news-row"
      [routerLink]="n.id ? ['/noticias', n.id] : '/noticias'"
      [style.border-bottom]="i < listItems().length - 1 ? '1px solid #f5f5f2' : 'none'">
      <div class="hm-news-thumb">
        <app-news-image
          [cat]="n.cat ?? 'f1'"
          [src]="n.imageUrl ?? null"
          [alt]="n.title"
          [height]="thumbHeight()"
          [accent]="accent()" />
      </div>
      <div class="hm-news-body">
        <span
          class="hm-news-tag"
          [ngStyle]="{
            color: n.hot ? (accent() === '#FFD100' ? '#C8963E' : accent()) : '#bbb',
            background: n.hot ? accent() + '18' : '#f0f0ea'
          }">{{ n.tag }}</span>
        <div class="hm-news-title">{{ n.title }}</div>
        <div class="hm-news-time">{{ n.time }}</div>
      </div>
    </a>
  }
</div>
