<div class="tb-root" style="background: #ffffff; border-bottom: 1px solid #e5e5e7; display: flex; align-items: center; height: 50px; padding: 0 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 2px rgba(0,0,0,.04);">
  <button
    type="button"
    class="tb-menu-btn"
    [class.tb-menu-btn--show]="shell.showMobileMenu()"
    aria-label="Abrir menú de navegación"
    (click)="shell.toggleSidebar()"
  >
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    </svg>
  </button>

  <a class="tb-logo-link" [routerLink]="homeLink()" style="display: flex; align-items: center; gap: 6px; margin-right: 28px; text-decoration: none;">
    <div [ngStyle]="{'background': accent(), 'width': '26px', 'height': '26px', 'clip-path': 'polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%)'}"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 1px; color: #1a1a1a;">
      Be<span [style.color]="accent()">Engine</span>
    </span>
  </a>

  <div class="tb-cats" style="display: flex; gap: 0; flex: 1;">
    @for (cat of categories(); track cat.id) {
      <button
        type="button"
        (click)="onCategoryClick(cat.id)"
        [ngStyle]="{
          'padding': '6px 14px',
          'font-family': 'Barlow Condensed, sans-serif',
          'font-weight': displayWorld() === cat.id ? '700' : '500',
          'font-size': '13px',
          'letter-spacing': '0.5px',
          'text-transform': 'uppercase',
          'color': displayWorld() === cat.id ? '#1a1a1a' : '#888',
          'background': displayWorld() === cat.id ? (cat.accent + '22') : 'transparent',
          'border-bottom': displayWorld() === cat.id ? ('2px solid ' + cat.accent) : '2px solid transparent',
          'transition': 'all 0.15s',
          'white-space': 'nowrap'
        }">{{ cat.short }}</button>
    }
  </div>

  <div
    class="tb-cat-segment"
    role="tablist"
    aria-label="Categoría"
  >
    @for (cat of categories(); track cat.id) {
      <button
        type="button"
        role="tab"
        class="tb-cat-segment-btn"
        [class.tb-cat-segment-btn--active]="displayWorld() === cat.id"
        [attr.aria-selected]="displayWorld() === cat.id"
        [style.--cat-accent]="cat.accent"
        (click)="onCategoryClick(cat.id)"
      >
        <span class="tb-cat-segment-mark" aria-hidden="true"></span>
        <span class="tb-cat-segment-label">{{ cat.short }}</span>
      </button>
    }
  </div>
</div>
