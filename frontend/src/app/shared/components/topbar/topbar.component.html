<div style="background: #ffffff; border-bottom: 1px solid #e5e5e7; display: flex; align-items: center; height: 50px; padding: 0 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 2px rgba(0,0,0,.04);">
  <!-- Logo -->
  <div style="display: flex; align-items: center; gap: 6px; margin-right: 28px;">
    <div [ngStyle]="{'background': accent(), 'width': '26px', 'height': '26px', 'clip-path': 'polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%)'}"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 1px; color: #1a1a1a;">
      Be<span [style.color]="'#FFD100'">Engine</span>
    </span>
  </div>

  <!-- Category tabs -->
  <div style="display: flex; gap: 0; flex: 1;">
    @for (cat of categories(); track cat.id) {
      <button
        (click)="catChange.emit(cat.id)"
        [ngStyle]="{
          'padding': '6px 14px',
          'font-family': 'Barlow Condensed, sans-serif',
          'font-weight': activeCat() === cat.id ? '700' : '500',
          'font-size': '13px',
          'letter-spacing': '0.5px',
          'text-transform': 'uppercase',
          'color': activeCat() === cat.id ? '#1a1a1a' : '#888',
          'background': activeCat() === cat.id ? (cat.accent + '22') : 'transparent',
          'border-bottom': activeCat() === cat.id ? ('2px solid ' + cat.accent) : '2px solid transparent',
          'transition': 'all 0.15s',
          'white-space': 'nowrap'
        }">{{ cat.short }}</button>
    }
  </div>

  <!-- Search + avatar -->
  <div style="display: flex; gap: 10px; align-items: center;">
    <div style="background: #f0f0f2; border: 1px solid #e0e0e0; border-radius: 4px; padding: 5px 12px; font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4" stroke="#888" stroke-width="1.5"/>
        <path d="M9.5 9.5 L13 13" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Buscar…
    </div>
    <div [ngStyle]="{'background': accent()}" style="width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #1a1a1a;">B</div>
  </div>
</div>
