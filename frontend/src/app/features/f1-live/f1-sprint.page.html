<div class="fl-root">
  <header class="fl-topbar">
    <div class="fl-topbar-left"><div class="fl-topbar-diamond"></div><a routerLink="/">Be<span>Engine</span></a></div>
    <nav class="fl-topbar-sessions" aria-label="Sesiones F1">
      <a routerLink="/f1/live/fp1" routerLinkActive="active" class="fl-top-session">FP1</a>
      <a routerLink="/f1/live/fp2" routerLinkActive="active" class="fl-top-session">FP2</a>
      <a routerLink="/f1/live/fp3" routerLinkActive="active" class="fl-top-session">FP3</a>
      <a routerLink="/f1/live/qualy" routerLinkActive="active" class="fl-top-session">QUALY</a>
      <a routerLink="/f1/live/qualy-sprint" routerLinkActive="active" class="fl-top-session">SPRINT</a>
      <a routerLink="/f1/live/sprint" routerLinkActive="active" class="fl-top-session">RACE</a>
    </nav>
  </header>
  <div class="fl-session-bar"><span class="fl-session-label-text">SESIÓN</span><button class="fl-session-btn active">SPRINT</button>
    <div class="fl-session-right"><span class="fl-session-elapsed-time">{{ elapsedDisplay() }}</span><span class="fl-session-elapsed-label">ELAPSED</span></div>
  </div>
  <div style="padding:18px;color:#444">Sprint page — short race elapsed (capped to ~25 minutes).</div>
</div>
